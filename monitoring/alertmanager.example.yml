global:
  resolve_timeout: 5m

route:
  receiver: slack-notifications
  group_by: ['alertname', 'job']
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h

receivers:
  - name: slack-notifications
    slack_configs:
      # Copy this example to monitoring/alertmanager.yml and replace the placeholder locally.
      # Never commit monitoring/alertmanager.yml or share its real URL.
      - api_url: 'https://hooks.slack.com/services/REPLACE/THIS/LOCALLY'
        channel: '#all-devops-alerts'
        send_resolved: true
        title: '{{ if eq .Status "firing" }}FIRING{{ else }}RESOLVED{{ end }}: {{ .CommonLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
          Summary: {{ .Annotations.summary }}
          Details: {{ .Annotations.description }}
          Severity: {{ .Labels.severity }}
          {{ end }}
